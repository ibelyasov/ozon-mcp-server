name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
