name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'jsonschema[format]==4.25.1'
      - run: python scripts/validate-contracts.py

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all -- --check
      - run: cargo +1.95.0 test --locked
      - run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
